<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 46">
  <title>Chic Nail &amp; Head Spa</title>
  <!-- Geometric 4-petal mark: two overlapping ovals + center circle -->
  <ellipse cx="23" cy="23" rx="9" ry="16" fill="none" stroke="#c9a96e" stroke-width="1"/>
  <ellipse cx="23" cy="23" rx="16" ry="9" fill="none" stroke="#c9a96e" stroke-width="1"/>
  <circle cx="23" cy="23" r="3.5" fill="none" stroke="#c9a96e" stroke-width="1"/>
  <!-- Hairline separator -->
  <line x1="48" y1="11" x2="48" y2="35" stroke="#c9a96e" stroke-width="0.75" opacity="0.45"/>
  <!-- Wordmark -->
  <text x="57" y="20" font-family="Cormorant Garamond,Georgia,serif" font-size="13" font-weight="400" letter-spacing="2.5" fill="#2c2420">CHIC NAIL</text>
  <text x="58" y="35" font-family="Jost,system-ui,sans-serif" font-size="7.5" font-weight="300" letter-spacing="4" fill="#8a7570">&amp; HEAD SPA</text>
</svg>
